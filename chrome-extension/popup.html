<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #333;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    button:hover {
      background-color: #45a049;
    }

    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }

    .status.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .info {
      font-size: 12px;
      color: #666;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <h1>Настройки расширения</h1>

  <label for="n8nUrl">URL webhook n8n:</label>
  <input type="text" id="n8nUrl" placeholder="https://your-n8n-instance.com/webhook/..." />

  <button id="saveBtn">Сохранить</button>

  <div id="status" class="status"></div>

  <label for="wordInput">Добавить слово в словарь:</label>
  <input type="text" id="wordInput" placeholder="Введите слово для добавления" />

  <button id="addWordBtn">Добавить слово1</button>

  <div id="wordStatus" class="status"></div>

  <div class="info">
    <strong>Как использовать:</strong><br>
    1. Введите URL webhook из n8n<br>
    2. Нажмите "Сохранить"<br>
    3. Выделите текст на любой странице<br>
    4. Нажмите правую кнопку мыши<br>
    5. Выберите "Добавить в словарь"
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
